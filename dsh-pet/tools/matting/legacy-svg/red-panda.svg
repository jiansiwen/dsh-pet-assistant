  <circle cx="138" cy="96" r="9.5" fill="#2B1B12"/>
  <circle cx="95" cy="93" r="3.2" fill="#FFFFFF"/>
  <circle cx="141" cy="93" r="3.2" fill="#FFFFFF"/>
  <!-- 鼻子和嘴 -->
  <ellipse cx="115" cy="117" rx="7.5" ry="5.5" fill="#2B1B12"/>
  <path d="M 107 128 Q 115 135 123 128" stroke="#2B1B12" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <ellipse cx="70" cy="120" rx="8" ry="5" fill="#FF9E9E" opacity="0.55"/>
  <ellipse cx="160" cy="120" rx="8" ry="5" fill="#FF9E9E" opacity="0.55"/>
