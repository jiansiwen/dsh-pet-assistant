  <ellipse cx="152" cy="114" rx="20" ry="16" fill="#FFF3E4"/>
  <ellipse cx="115" cy="124" rx="27" ry="20" fill="#FFF3E4"/>
  <!-- 眉斑 -->
  <ellipse cx="90" cy="70" rx="10" ry="7" fill="#FFF3E4"/>
