<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    阅读视图一律离线：脚本、样式只认本目录；字体只来自 PDF 自带数据或主进程经 IPC 交来的随包标准字体
    （FontFace 二进制，不走 URL）；图片只允许画布导出的 data/blob。connect-src 禁掉——页面数据全部走
    IPC 向主进程要，页面没有任何理由自己发请求。worker-src 禁掉：pdf.js 在本线程内运行。
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <title>阅读视图</title>
  <link rel="stylesheet" href="./doc-view.css" />
</head>
<body>
  <div id="root"></div>
  <script src="./doc-view.js"></script>
</body>
</html>
